<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refboard Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Refboard Builder <span>фасад и модули → лист 1980×1020</span></div>
    <div class="actions">
      <label class="btn">Открыть проект<input type="file" id="loadProject" accept=".json" hidden></label>
      <button class="btn" id="saveProject">Сохранить проект</button>
      <button class="btn primary" id="exportPng">Скачать PNG</button>
    </div>
  </header>

  <div class="layout">
    <aside class="panels">
      <details open>
        <summary>1. Проект</summary>
        <div class="fields" id="projectFields"></div>
      </details>

      <details open>
        <summary>2. Сетка и этажи</summary>
        <div class="fields" id="gridFields"></div>
      </details>

      <details open>
        <summary>3. Общий вид</summary>
        <div id="overviewPanel"></div>
      </details>

      <details open>
        <summary>4. Модули</summary>
        <label class="drop" id="moduleDrop">
          Перетащите фото модулей сюда или нажмите, чтобы выбрать
          <input type="file" id="moduleFiles" accept="image/*" multiple hidden>
        </label>
        <p class="hint">В рамке: тяните мышью — сдвиг, колесо — масштаб, двойной клик — сброс.</p>
        <div id="moduleList"></div>
      </details>

      <details open>
        <summary>5. Схема фасада</summary>
        <p class="hint">Выберите модуль и кликайте по клеткам. Правый клик — очистить клетку.</p>
        <div id="layoutPanel"></div>
      </details>

      <details open>
        <summary>6. Материалы</summary>
        <div id="palettePanel"></div>
      </details>
    </aside>

    <main class="preview">
      <canvas id="sheet" width="1980" height="1020"></canvas>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
